services:

  # ── Core ────────────────────────────────────────────────────────────────────

  pi-control-bot:
    build: ./bot
    container_name: pi-control-bot
    hostname: pi-control-bot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: "${TZ:-UTC}"
      DOCKER_HOST: "tcp://socket-proxy:2375"
    volumes:
      # Registry persistence — stores the container registry between restarts.
      - ./bot-data:/data
      # Config directory (plugins, log rules)
      - ./bot/config:/app/config
      # Must be mounted at the exact host path so that "docker compose" calls
      # inside the container produce volume paths the daemon can resolve.
      - ${DESKTOP_PATH:?Set DESKTOP_PATH in .env}:${DESKTOP_PATH:?Set DESKTOP_PATH in .env}:rw
      # Extra disks — mounted read-only so host_status_text can report their usage.
      - /mnt/backup-ssd:/mnt/backup-ssd:ro
    deploy:
      resources:
        limits:
          cpus: "0.4"
          memory: 256M
    networks:
      - pi-monitor
      - socket-proxy
      - ollama-net

networks:
  pi-monitor:
    driver: bridge
  socket-proxy:
    external: true
    name: socket-proxy
  # ollama-mini — shared LLM backend for log_anomaly_spotter plugin
  ollama-net:
    external: true
    name: ollama-net
